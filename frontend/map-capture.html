<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>새 해 · 지도 장소 촬영</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #cdb5d2;
      }
      /* 지도 표식용 정사각형 사진 */
      #root {
        width: 480px;
        height: 480px;
      }
      /* 전체 지도 사진은 캔버스 자체 크기를 쓴다 */
      .overview #root {
        width: auto;
        height: auto;
      }
    </style>
  </head>
  <body>
    <script>
      if (/overview|walkable/.test(location.search))
        document.body.classList.add('overview')
    </script>
    <div id="root"></div>
    <script type="module" src="/src/preview/MapCapture.tsx"></script>
  </body>
</html>
