name: naru

services:
  frontend:
    build: ./frontend
    environment:
      NARU_API_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/health').then(async r => { if (!r.ok || (await r.json()).status !== 'UP') process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    environment:
      SERVER_PORT: "8080"
      NARU_WORLD_MAX_ROOMS: ${NARU_WORLD_MAX_ROOMS:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
